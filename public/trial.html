<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trial · Agent Courtroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <link rel="stylesheet" href="/public/style.css" />
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">⚖️ Agent <span>Courtroom</span></a>
    <div class="spacer"></div>
    <a class="pill" id="replay" href="#">↻ Replay</a>
    <a class="pill" id="prLink" href="#" target="_blank" rel="noopener">View PR on GitHub ↗</a>
  </div>

  <div class="case-head">
    <div class="grow">
      <div class="t" id="caseTitle">Convening…</div>
      <div class="s" id="caseSub"></div>
    </div>
    <span class="chip in_session" id="caseChip">IN SESSION</span>
  </div>

  <div class="court">
    <section class="side prosecution">
      <header>PROSECUTION <span class="state" id="stateP">waiting</span></header>
      <div class="feed" id="feedP"></div>
    </section>

    <section class="bench">
      <header>THE BENCH</header>
      <div class="feed" id="bench">
        <div class="rounds" id="rounds"></div>
        <div class="card"><h4>Clerk</h4><div id="statusLog"></div></div>
      </div>
    </section>

    <section class="side defense">
      <header>DEFENSE <span class="state" id="stateD">waiting</span></header>
      <div class="feed" id="feedD"></div>
    </section>
  </div>

  <div class="verdict-overlay" id="overlay"><div class="stamp" id="stamp"></div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="/public/trial.js"></script>
</body>
</html>
